name: Phase 2C Oracle Monitoring and Evidence

on:
  push:
    branches: [main, feat/unihack-phase2-backend, feat/unihack-phase2b-avalanche, feat/unihack-phase2c-oracle-evidence, fix/contest-readiness-20261111]
  pull_request:

jobs:
  phase2c-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sladex_test
          POSTGRES_USER: sladex_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sladex_test -d sladex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contracts/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Validate backend
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
          TEST_DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
          CORS_ORIGINS: http://localhost:3000
        run: |
          npm run lint
          npm run build
          npm run typecheck
          npm run typecheck:anchor-integration
          npm run test:unit
          npm run test:integration
          npm run test:migration-upgrade
          npm audit --audit-level=high
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate Phase 2C frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: |
          npm run test:api
          npm run lint
          npx tsc --noEmit
          npm run build
          npm run test:production-smoke
          npm audit --audit-level=high
      - name: Install local EVM dependencies
        working-directory: contracts
        run: npm ci
      - name: Run Phase 2C full-stack acceptance twice
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
        run: npm run test:phase2c-acceptance -- --output "$RUNNER_TEMP/phase2c-acceptance"
      - name: Run monitoring worker reliability against isolated PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
        run: npm run test:monitoring-reliability -- --output "$RUNNER_TEMP/phase2c-acceptance"
      - name: Run evidence publisher reliability against isolated PostgreSQL and EVM
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
        run: npm run test:evidence-reliability -- --output "$RUNNER_TEMP/phase2c-acceptance"
      - name: Upload Phase 2C acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-acceptance-evidence
          path: ${{ runner.temp }}/phase2c-acceptance/
          if-no-files-found: ignore
      - name: Start deterministic local EVM
        working-directory: contracts
        run: |
          nohup npx hardhat node --network hardhatMainnet --hostname 127.0.0.1 </dev/null > "$RUNNER_TEMP/sladex-hardhat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sladex-hardhat.pid"
          for attempt in $(seq 1 60); do
            chain_id=$(curl --silent --show-error --fail -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result))') || true
            if [ "$chain_id" = "0x7a69" ]; then exit 0; fi
            sleep 2
          done
          node -e 'const fs=require("node:fs");process.stderr.write(fs.readFileSync(process.env.RUNNER_TEMP+"/sladex-hardhat.log","utf8"));process.exit(1)'
      - name: Deploy registry to local EVM
        working-directory: contracts
        run: |
          npx hardhat run scripts/deploy.ts --network localEvm > "$RUNNER_TEMP/sladex-registry.json"
          node -e 'const fs=require("node:fs");const text=fs.readFileSync(process.env.RUNNER_TEMP+"/sladex-registry.json","utf8");const match=text.match(/\{"chainId":\d+,"registryAddress":"0x[0-9a-fA-F]{40}"\}/);if(!match)throw new Error("local registry deployment did not return its address");const deployed=JSON.parse(match[0]);fs.appendFileSync(process.env.GITHUB_ENV,`ANCHOR_TEST_CHAIN_ID=${deployed.chainId}\nANCHOR_TEST_REGISTRY_ADDRESS=${deployed.registryAddress}\n`);'
      - name: Deploy evidence registry to local EVM
        working-directory: contracts
        env:
          EVIDENCE_PUBLISHER_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
        run: |
          npx hardhat run scripts/deploy-evidence.ts --network localEvm > "$RUNNER_TEMP/sladex-evidence-registry.json"
          node -e 'const fs=require("node:fs");const text=fs.readFileSync(process.env.RUNNER_TEMP+"/sladex-evidence-registry.json","utf8");const match=text.match(/\{"chainId":\d+,"registryAddress":"0x[0-9a-fA-F]{40}","publisher":"0x[0-9a-fA-F]{40}"\}/);if(!match)throw new Error("local evidence registry deployment did not return its address");const deployed=JSON.parse(match[0]);fs.appendFileSync(process.env.GITHUB_ENV,`EVIDENCE_TEST_CHAIN_ID=${deployed.chainId}\nEVIDENCE_TEST_REGISTRY_ADDRESS=${deployed.registryAddress}\n`);'
      - name: Run PostgreSQL and EVM relayer fault matrix
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
          ANCHOR_TEST_RPC_URL: http://127.0.0.1:8545
          ANCHOR_TEST_RELAYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        run: |
          set -o pipefail
          npm run test:anchor-integration 2>&1 | tee "$RUNNER_TEMP/anchor-recovery-integration.log"
      - name: Start backend for browser E2E
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
          CORS_ORIGINS: http://127.0.0.1:3000
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:8545
          BLOCKCHAIN_CHAIN_ID: "31337"
          BLOCKCHAIN_REGISTRY_ADDRESS: ${{ env.ANCHOR_TEST_REGISTRY_ADDRESS }}
          BLOCKCHAIN_RELAYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          BLOCKCHAIN_CONFIRMATIONS: "1"
          EVIDENCE_RPC_URL: http://127.0.0.1:8545
          EVIDENCE_CHAIN_ID: ${{ env.EVIDENCE_TEST_CHAIN_ID }}
          EVIDENCE_REGISTRY_ADDRESS: ${{ env.EVIDENCE_TEST_REGISTRY_ADDRESS }}
          EVIDENCE_RELAYER_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
          EVIDENCE_CONFIRMATIONS: "1"
        run: |
          export MONITORING_SECRET_ENCRYPTION_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          nohup npm start </dev/null > "$RUNNER_TEMP/sladex-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sladex-backend.pid"
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/api/v1/auth/me || true)
            if [ "$status" = "401" ]; then exit 0; fi
            sleep 2
          done
          node -e 'const fs=require("node:fs");process.stderr.write(fs.readFileSync(process.env.RUNNER_TEMP+"/sladex-backend.log","utf8"));process.exit(1)'
      - name: Install Playwright Chromium
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: npx playwright install --with-deps chromium
      - name: Run inherited Phase 2B live signing regression
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: npx playwright test --config=playwright.config.ts --grep "live SLA signing"
      - name: Run authenticated monitoring and source management browser flows
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
          DATABASE_URL: postgresql://sladex_test:local-test-only@localhost:5433/sladex_test?schema=public
        run: npx playwright test --config=playwright.config.ts tests/e2e/phase2c.spec.ts --grep "Gate 3C" --retries=0
      - name: Run inherited Phase 2B expired authorization regression
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: npx playwright test --config=playwright.config.ts --grep "expired signing authorization"
      - name: Run Phase 2C monitoring browser cases at 375, 768 and 1440 pixels
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: npx playwright test --config=playwright.config.ts tests/e2e/phase2c.spec.ts --grep-invert "Gate 3C"
      - name: Print relayer failure diagnostics
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/anchor-recovery-integration.log" "$RUNNER_TEMP/sladex-backend.log"; do
            if [ -f "$log" ]; then
              echo "--- Safe relayer error types from $(basename "$log") ---"
              grep -F "Agreement anchor processing failed" "$log" || true
            fi
          done
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-browser-failure-artifacts
          path: |
            ${{ runner.temp }}/anchor-recovery-integration.log
            ${{ runner.temp }}/sladex-backend.log
            ${{ runner.temp }}/sladex-hardhat.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Check whitespace errors
        if: always()
        run: git diff --check
      - name: Stop local EVM and backend
        if: always()
        run: |
          for name in sladex-backend sladex-hardhat; do
            pid_file="$RUNNER_TEMP/$name.pid"
            if [ -f "$pid_file" ]; then read -r pid < "$pid_file"; kill "$pid" 2>/dev/null || true; fi
          done
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci
      - name: Compile and test on the local EVM
        working-directory: contracts
        run: |
          npm run compile
          npm run typecheck
          npm test
      - name: Audit contract dependencies
        working-directory: contracts
        run: npm audit --audit-level=high
